var D={
nucleus:{t:"Nucleus",
d:[["Structure","The main components of the cell nucleus are the nuclear envelope, nuclear pore complexes, nucleoplasm, chromatin, nucleolus, and nuclear lamina (Britannica)."],["Main function","The primary function of the nucleus is to store and protect the cell’s genetic material (DNA) and regulate gene expression, directing key processes such as metabolism and cell division (Britannica)."]],
dep:[["Ribosomes","The nucleus builds ribosomal parts inside the nucleolus and ships out messenger RNA (mRNA) blueprints. Without these instructions and parts, ribosomes cannot assemble or build proteins (Stanford Medicine)."],["Endoplasmic Reticulum (ER)","The outer membrane of the nucleus connects directly to the ER and feeds it mRNA blueprints. The ER needs these instructions to know which proteins and lipids to manufacture and fold (NIH)."],["Mitochondria","Although mitochondria have a small amount of their own DNA, they rely on the nucleus for most of their structural proteins and enzymes. Without nuclear instructions, mitochondria cannot generate energy for the cell (NIH)."]],
f:"When the nucleus malfunctions, DNA protection, gene expression, and molecular transport break down, preventing the cell from making essential proteins or dividing properly (NIH).",
dis:[["Hutchinson-Gilford Progeria Syndrome","Mutations in the LMNA gene create a faulty lamin A protein that warps the nuclear membrane, disrupting cell division and causing rapid premature aging (NIH)."],["Emery-Dreifuss Muscular Dystrophy","Missing or defective nuclear envelope proteins make nuclei fragile, causing muscle cells to break down under physical strain (MedlinePlus)."],["Li-Fraumeni Syndrome (Cancer)","Mutations in the nuclear protein p53 prevent the nucleus from stopping the division of cells with damaged DNA, leading to tumor growth (MedlinePlus)."]]},
ribosomes:{t:"Ribosomes",
d:[["Structure","A ribosome is an intracellular structure made of both RNA and protein, split into the large and small subunits (Lec 8 Unit 3)."],["Main function","Its main function is protein synthesis in the cell. The ribosome reads the messenger RNA (mRNA) sequence and translates that genetic code into a specified string of amino acids, which grow into long chains that fold to form proteins. It achieves this by traveling along the mRNA molecule and reading each three-letter codon, serving as a docking station where the codon pairs with a matching anticodon on a specific transfer RNA (tRNA) to add the correct amino acid to the growing chain (NIH)."]],
dep:[["The Nucleus","Ribosomes completely rely on the Nucleus for their creation and instructions. The nucleolus is a segment inside the nucleus, and assembles ribosomal subunits (Lec 8 Unit 3)."],["The Mitochondria","Acts as the powerplant that keeps ribosomes running. Without this energy, ribosomes are unable to link amino acids together to make proteins (NIH)."],["The Rough Endoplasmic Reticulum (ER)","Ribosomes depend on the ER as a docking station to build, fold, and export proteins. Without the ER, these proteins would never reach their final destination (NIH)."]],
f:"If ribosomes don’t form correctly, cells can’t make enough proteins, leading to serious diseases (Stowers Institute for Medical Research).",
dis:[["Diamond-Blackfan Anemia","Missing ribosomal building blocks stop the bone marrow from making proteins needed for red blood cells. As a result, young red blood cells die off, causing severe anemia (NIH)."],["Treacher Collins syndrome","This disorder affects the development of bones and tissues in the face. Cells fail to produce enough ribosomal RNA during early fetal development. This lack of ribosomes kills off facial tissue cells, leading to underdeveloped cheekbones and jaws (MedlinePlus)."],["Shwachman-Diamond syndrome","This inherited condition causes bone marrow dysfunction, poor growth, and pancreatic insufficiency. The two halves of the ribosome cannot lock together properly to finish building (Cleveland Clinic)."]]},
rer:{t:"Rough Endoplasmic Reticulum",
d:[["Structure","When proteins are destined to be part of the cell membrane or exported from the cell, the ribosomes assembling them attach to the endoplasmic reticulum, giving it a rough appearance."],["Main function","Its function is to produce proteins for the rest of the cell to function."]],
dep:[["Golgi Apparatus","Receives proteins from the rough ER to modify, sort, and package."],["Lysosomes","Depend on the rough ER to produce the digestive enzymes they need to break down waste."],["Plasma Membrane","Receives important membrane proteins that are first made and folded in the rough ER."]],
f:"Proteins may fold incorrectly or fail to reach their proper destinations. This can cause defective proteins to build up and prevent cells from functioning normally.",
dis:[["Cystic Fibrosis","A common mutation causes the CFTR protein to fold incorrectly in the ER. The protein is usually destroyed before reaching the cell membrane, contributing to thick mucus buildup in the lungs and other organs."],["Alpha-1 Antitrypsin Deficiency","A defective protein can accumulate inside the ER of liver cells, causing liver damage and increasing the risk of cirrhosis."],["Osteogenesis Imperfecta (Brittle Bone Disease)","Certain mutations disrupt collagen folding and processing in the rough ER, resulting in weak bones that fracture easily."]]},
ser:{t:"Smooth Endoplasmic Reticulum",
d:[["Structure","The smooth ER is a network of membranes without ribosomes attached to its surface."],["Main function","Produces lipids, helps break down drugs and harmful substances, and regulates calcium storage. In muscle cells, a specialized version called the sarcoplasmic reticulum stores and releases calcium for muscle contraction."]],
dep:[["Plasma Membrane","Uses lipids made by the smooth ER to help build and maintain its membrane."],["Mitochondria","Work closely with the ER to exchange lipids and regulate calcium levels."],["Golgi Apparatus","Receives certain lipids from the ER for further processing and transport."]],
f:"Cells may struggle to produce important lipids, process certain chemicals, or control calcium levels. This can disrupt muscle movement, cell signaling, and other normal functions.",
dis:[["Malignant Hyperthermia","Certain genetic changes cause too much calcium to be released from the sarcoplasmic reticulum during exposure to specific anesthesia drugs. This can cause dangerous muscle contractions and a rapid rise in body temperature."],["Darier Disease","A defective calcium pump prevents the ER from maintaining normal calcium levels, weakening connections between skin cells and causing rough, scaly skin."],["Wolfram Syndrome","Defects in an ER membrane protein interfere with calcium regulation and cell survival. This can damage insulin-producing cells and optic nerve cells, causing diabetes and vision loss."]]},
golgi:{t:"Golgi Apparatus",
d:[["Structure","The Golgi apparatus is made of stacks of flattened, membrane-covered sacs."],["Main function","Modifies, sorts, and packages proteins and lipids received from the ER. It helps make sure materials reach the correct destinations inside or outside the cell."]],
dep:[["Lysosomes","Depend on the Golgi to label and sort digestive enzymes so they reach the correct destination."],["Plasma Membrane","Receives proteins and lipids that have been processed and transported through the Golgi."],["Secretory Vesicles","Receive packaged materials from the Golgi before transporting them to other locations or releasing them outside the cell."]],
f:"Proteins and lipids may not be modified or delivered correctly. Important materials can end up in the wrong location, disrupting normal cellular processes.",
dis:[["I-cell Disease (Mucolipidosis II)","A defective Golgi enzyme cannot properly label digestive enzymes for delivery to lysosomes. As a result, waste accumulates inside cells and causes serious developmental problems."],["Wilson Disease","A defective copper transporter that normally works through the Golgi transport system prevents the body from removing excess copper properly. Copper accumulates in the liver, brain, and other organs."],["Cutis Laxa Type 2A","A defective protein disrupts normal Golgi acidity and protein processing. This contributes to weak elastic fibers, causing unusually loose and sagging skin."]]},
mito:{t:"Mitochondria",
d:[["Structure","Mitochondria are membrane-bound organelles, with two different membranes. They consist of a smooth outer membrane, and a highly folded inner membrane. These folds called cristae, surround the internal fluid known as the matrix (NIH)."],["Main function","Mitochondria break down sugars through cellular respiration, and convert energy into ATP (Lec 10 Unit 5). Mitochondria supply the necessary energy for almost every active process in the cell (NIH)."]],
dep:[["Plasma Membrane","Depends on ATP from mitochondria to power ion pumps that maintain important concentration differences."],["Lysosomes","Need energy to maintain their acidic environment and carry out normal cellular recycling."],["Cytoskeleton","Uses ATP-powered motor proteins to transport materials and organelles throughout the cell."]],

lyso:{t:"Lysosomes",s:"The cell’s recycling centers",
d:[["","They are surrounded by a membrane and contain enzymes that break down waste, damaged organelles, and materials the cell no longer needs. The cell can then reuse some of these materials."]],
dep:[["Endosomes","Bring materials to lysosomes to be broken down."],["","Damaged mitochondria can be broken down and recycled by lysosomes."],["Plasma Membrane","Uses lysosomal pathways to get rid of certain old or damaged membrane proteins."]],
f:"Waste starts building up because the cell can no longer break it down properly. Over time, this buildup can damage cells and interfere with their normal functions.",
dis:[["Parkinson’s disease","Problems with lysosomal recycling can allow harmful proteins, including alpha-synuclein, to accumulate in neurons."],["Alzheimer’s disease","Impaired lysosomal breakdown can contribute to the buildup of abnormal proteins and damage to brain cells."],["Cancer","Cancer cells can increase lysosomal recycling to obtain nutrients, helping them survive, grow, and sometimes resist treatment."]]},

var dlg=document.getElementById("dlg"),dbody=document.getElementById("dbody"),dx=document.getElementById("dx"),opener=null;

function render(id){
  var x=D[id],h="<h2 id='dt'>"+x.t+"</h2>";
  if(x.s)h+="<p class='tag'>"+x.s+"</p>";
  h+="<h3>Description and normal function</h3>"+(x.d?x.d.map(function(r){return "<p>"+(r[0]?"<b>"+r[0]+":</b> ":"")+r[1]+"</p>"}).join(""):soon);
  h+=acc(1,"Top 3 dependencies",x.dep?"<ul>"+x.dep.map(li).join("")+"</ul>":soon);
  h+=acc(2,"What happens if it malfunctions",x.f?"<p>"+x.f+"</p>":soon);
  h+=acc(3,"Associated diseases",x.dis?"<ul>"+x.dis.map(li).join("")+"</ul>":soon);

var chipEls={};
function select(id){
  document.querySelectorAll(".part").forEach(function(p){p.classList.toggle("on",p.getAttribute("data-id")===id)});
  Object.keys(chipEls).forEach(function(k){chipEls[k].setAttribute("aria-pressed",k===id?"true":"false")});
  openDlg(render(id));
}

  var id=p.getAttribute("data-id");
  p.querySelectorAll('path[stroke="transparent"]').forEach(function(h){h.classList.add("hit")});
  if(id==="rer"||id==="ser"||id==="golgi"){p.querySelectorAll("path").forEach(function(s){var c=s.cloneNode(false);c.setAttribute("class","hit");c.setAttribute("fill","none");c.setAttribute("stroke","transparent");c.setAttribute("stroke-width","22");c.setAttribute("stroke-linecap","round");p.appendChild(c)})}
  p.setAttribute("tabindex","0");p.setAttribute("role","button");p.setAttribute("aria-label",names[id]);
  var t=document.createElementNS(NS,"title");t.textContent=names[id];p.insertBefore(t,p.firstChild);
  p.addEventListener("click",function(){select(id)});
  p.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();select(id)}});
});
